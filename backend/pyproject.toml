[project]
name = "nebulagrid-backend"
version = "0.1.0"
description = "NebulaGrid backend API service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.7.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
